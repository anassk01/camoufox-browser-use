[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "camoufox-browser-use"
version = "0.5.1"
description = "CDP-free Firefox/Camoufox Playwright backend for browser-use."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anass Kabil", email = "contact@pullmesh.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "browser-use>=0.13.13,<0.14",
    "camoufox>=0.4.0",
    "playwright>=1.50.0,<1.64.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/anassk01/camoufox-browser-use"
Repository = "https://github.com/anassk01/camoufox-browser-use"
Issues = "https://github.com/anassk01/camoufox-browser-use/issues"
Services = "https://pullmesh.com/services/"

[tool.setuptools.packages.find]
where = ["."]
include = ["camoufox_browseruse*"]
