name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ANONYMIZED_TELEMETRY: 'False'
  BROWSER_USE_CLOUD_SYNC: 'False'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[dev]'
      - run: python -m compileall camoufox_browseruse tests benchmarks
      - run: >-
          python -m pytest tests/test_unit_core.py tests/test_evaluation_contracts.py
          tests/test_launcher.py tests/test_learning.py tests/test_runner.py

  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[dev]'
      - run: python -m playwright install-deps firefox
      - run: python -m camoufox fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python run_tests.py
